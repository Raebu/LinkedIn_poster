name: LinkedIn Agent
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [post, growth, identity]
        default: identity
      live:
        description: Publish live
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'
    - cron: '17 12 * * 3'
    - cron: '17 16 * * 5'
    - cron: '41 10 * * 2,4'
permissions:
  contents: read
concurrency:
  group: linkedin-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_GROWTH_ACCESS_TOKEN: ${{ secrets.LINKEDIN_GROWTH_ACCESS_TOKEN }}
      LINKEDIN_GROWTH_CLIENT_ID: ${{ secrets.LINKEDIN_GROWTH_CLIENT_ID }}
      LINKEDIN_GROWTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_GROWTH_CLIENT_SECRET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SOCIAL_MEMORY_SHEET_ID: ${{ vars.SOCIAL_MEMORY_SHEET_ID || '1yIwJqlmgRbp1_o4MFCLHMSOOgaE3DYMd31eF43dF9bs' }}
      LINKEDIN_REDIRECT_URI: ${{ vars.LINKEDIN_REDIRECT_URI }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202609' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      LINKEDIN_MEDIA_LIVE: 'true'
      LINKEDIN_COMMUNITY_LIVE: ${{ vars.LINKEDIN_COMMUNITY_LIVE || 'false' }}
      GROWTH_MAX_ACTIONS: ${{ vars.GROWTH_MAX_ACTIONS || '5' }}
      GROWTH_RELATIONSHIP_COOLDOWN_HOURS: ${{ vars.GROWTH_RELATIONSHIP_COOLDOWN_HOURS || '36' }}
      STATE_FILE: /tmp/linkedin-state/state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Initialise memory path
        run: mkdir -p /tmp/linkedin-state
      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: /tmp/linkedin-state
          key: linkedin-state-${{ github.run_id }}
          restore-keys: linkedin-state-
      - name: Decide mode
        id: cfg
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = 'schedule' ]; then
            HOUR='${{ github.event.schedule }}'
            if [ "$HOUR" = '41 10 * * 2,4' ]; then MODE=growth; else MODE=post; fi
            LIVE=true
          else
            MODE='${{ inputs.mode }}'; [ -z "$MODE" ] && MODE=identity
            LIVE='${{ inputs.live }}'; [ -z "$LIVE" ] && LIVE=false
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "live=$LIVE" >> "$GITHUB_OUTPUT"
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$LINKEDIN_ACCESS_TOKEN" || { echo 'Missing LINKEDIN_ACCESS_TOKEN'; exit 1; }
          if [ '${{ steps.cfg.outputs.mode }}' = post ] || [ '${{ steps.cfg.outputs.mode }}' = growth ]; then test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY'; exit 1; }; fi
          if [ '${{ steps.cfg.outputs.mode }}' = growth ] && [ "$LINKEDIN_COMMUNITY_LIVE" = true ]; then test -n "$LINKEDIN_GROWTH_ACCESS_TOKEN" || { echo 'Community Management is live but growth token is missing'; exit 1; }; fi
      - name: Initialise Google Sheets memory
        if: steps.cfg.outputs.mode == 'growth'
        run: python -c "import gdrive_memory as g; g.ensure_tabs(); print('Google Sheets memory:', 'enabled' if g.enabled() else 'fallback cache only')"
      - name: Verify LinkedIn identity
        if: steps.cfg.outputs.mode == 'identity'
        run: python -c "from linkedin_api import LinkedIn; u=LinkedIn().userinfo(); print('Authenticated LinkedIn member:',u.get('name') or u.get('given_name'),'sub:',u.get('sub'))"
      - name: Run post engine
        if: steps.cfg.outputs.mode == 'post'
        env:
          DRY_RUN: ${{ steps.cfg.outputs.live != 'true' }}
        run: python post.py
      - name: Run growth engine
        if: steps.cfg.outputs.mode == 'growth'
        env:
          DRY_RUN: ${{ steps.cfg.outputs.live != 'true' }}
        run: python growth.py
      - name: Save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/linkedin-state
          key: linkedin-state-${{ github.run_id }}
